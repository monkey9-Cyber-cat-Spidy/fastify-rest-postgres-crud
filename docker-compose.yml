version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fastify_store
    ports:
      - "5432:5432"
    restart: always

  api:
    build: .
    container_name: fastify_crud_api
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/fastify_store
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always
